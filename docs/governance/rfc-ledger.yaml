schema: powercontext.rfc-ledger.v1
baseline_commit: 733e4bf6b378785e76274ff07632029c699ecb09
source: ../powercontext/docs/en/rfcs
rule: Draft RFC is not a parity source and must not become a hidden M4 requirement.
statuses:
  implemented: Accepted design whose shipped Python behavior is the current oracle.
  accepted-not-implemented: Merged design that is not yet observable in pinned Python.
  draft: RFC header still says Draft. Only already-shipped Python behavior may be aligned.
  superseded: Template or replaced document. Ignore for parity.

rfcs:
