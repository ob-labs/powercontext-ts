schema: powercontext.capability-manifest.v1
baseline_commit: 733e4bf6b378785e76274ff07632029c699ecb09
api_version: 0.0.2
status: phase-0-frozen
full_parity: docs/governance/full-parity.md

owners:
  protocol-owner:
    role: Protocol, generated types, official Client
    milestone_focus: [M1, M4]
  runtime-owner:
    role: Core, persistence, domain services
    milestone_focus: [M2, M3, M4]
  product-owner:
    role: HTTP Server, MCP, CLI, Dashboard, host acceptance
    milestone_focus: [M2, M4]
  conformance-owner:
    role: Fixtures, oracle, parity reports
    milestone_focus: [M1, M2, M3, M4]
  python-owner:
    role: Python reference coordination and cross-repo PRs
    milestone_focus: [P5, P11, P12]

unimplemented_defaults:
  http: Do not register the route in the current profile. Accidental hits return ErrorResponse capability_unavailable; never 200 empty success.
  capabilities: Keep the matching Capabilities field false. Readiness may be ready or degraded; it must not advertise the missing feature.
  mcp: Omit the tool until the runtime milestone is done and the operation stays in the frozen 22-id allowlist.
  cli: Omit the command from the shipped CLI profile until the product milestone.
  persistence: Do not write a shared Python database. Experimental self-created databases must not be called parity.

profiles:
  client:
    first_milestone: M1
    target_level: C1
    meaning: Official typed HTTP Client talks to any compliant Server.
  sqlite-fts:
    first_milestone: M2
    target_level: C3
    meaning: Local deterministic Runtime with Memory FTS and subset HTTP.
  sqlite-vector:
    first_milestone: M4
    target_level: C4
    meaning: sqlite-fts plus embedding, Vec1, hybrid and rerank.
  oceanbase-hybrid:
    first_milestone: M4
    target_level: C4
    meaning: OceanBase FTS, vector, HNSW and identity collation.
  full-product:
    first_milestone: M4
    target_level: C5
    meaning: Full HTTP, MCP, CLI, Dashboard, hosts, ops and release evidence.

