name: Nightly contract advisory

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  advisory:
    name: python-main-openapi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/contract-sync/requirements.lock.txt
      - name: Compare Python main OpenAPI
        id: advisory
        continue-on-error: true
        run: python tools/contract-sync/advisory.py --output conformance/reports/nightly-openapi-advisory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-openapi-advisory
          path: conformance/reports/nightly-openapi-advisory.json
      - name: Open compatibility review issue
        if: steps.advisory.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('conformance/reports/nightly-openapi-advisory.json', 'utf8')
            const title = 'Nightly advisory: Python main OpenAPI drifted from TS baseline lock'
            const body = [
              'This issue is advisory. It must not block ordinary TypeScript PRs.',
              '',
              'Open a dedicated baseline bump PR after compatibility review.',
              '',
              '```json',
              report,
              '```',
            ].join('\n')
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'contract-advisory',
              })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'contract-advisory',
                color: 'd4c5f9',
                description: 'Automated advisory for Python/TypeScript contract drift',
              })
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'contract-advisory',
            })
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['contract-advisory'],
            })
