name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -r tools/contract-sync/requirements.lock.txt
      - run: pnpm install --frozen-lockfile
      - name: Checkout Python pin
        uses: actions/checkout@v4
        with:
          repository: oceanbase/powercontext
          ref: 733e4bf6b378785e76274ff07632029c699ecb09
          path: .python-pin
      - run: python conformance/runners/python/bootstrap.py --python-repo .python-pin
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm license:check
      - run: pnpm generate:check
      - run: pnpm deps:licenses
      - run: pnpm deps:audit
      - run: python tools/contract-sync/sync.py --check --python-repo .python-pin
      - run: python tools/contract-sync/verify.py --python-repo .python-pin
      - run: python tools/contract-sync/test_sync.py --python-repo .python-pin
      - run: pnpm pack:smoke

  client-matrix:
    name: client-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:client

  runtime-matrix:
    name: runtime-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:runtime

  smoke:
    name: smoke
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/contract-sync/requirements.lock.txt
      - run: pnpm install --frozen-lockfile
      - name: Checkout Python pin
        uses: actions/checkout@v4
        with:
          repository: oceanbase/powercontext
          ref: 733e4bf6b378785e76274ff07632029c699ecb09
          path: .python-pin
      - run: pnpm deps:licenses
      - run: pnpm build
      - run: pnpm test:sqlite-spike
      - run: python tools/contract-sync/sync.py --check --python-repo .python-pin
      - run: python tools/contract-sync/verify.py --python-repo .python-pin
      - run: python tools/contract-sync/test_sync.py --python-repo .python-pin
      - run: pnpm pack:smoke

  oracle-smoke:
    name: oracle-smoke
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -r tools/contract-sync/requirements.lock.txt
      - name: Checkout Python pin
        uses: actions/checkout@v4
        with:
          repository: oceanbase/powercontext
          ref: 733e4bf6b378785e76274ff07632029c699ecb09
          path: .python-pin
      - run: python conformance/runners/python/bootstrap.py --python-repo .python-pin
      - run: python conformance/runners/python/run.py --check
